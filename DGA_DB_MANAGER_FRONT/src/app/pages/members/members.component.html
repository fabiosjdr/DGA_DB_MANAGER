<app-default-page-layout 
title="Membros equipe" 
[pageForm]="membersForm" 
[path]="getPath()" 
[PathVariable]="getPathVariable()"
[MethodPathVariable]="['search']"
(setList)="setList($event)" 
[disableSaveBtn]="!membersForm.valid"
>
   <section form-page-body> 
      <form [formGroup]="membersForm" class="ng-untouched ng-pristine ng-valid">
      
          <div class="row">
              <!--cliente-->
              <mat-form-field appearance="outline" class="col-md-4 pr-1">
                <mat-label>Usuário</mat-label>
                <input type="text"
                       placeholder="Selecione um cliente"
                       aria-label="usuário"
                       matInput
                       [formControl]="userControl"
                       [matAutocomplete]="autoCategory">

                <mat-autocomplete  #autoCategory="matAutocomplete" (optionSelected)='autoFnClient.setValue($event.option.value)' [displayWith]="autoFnClient.displayFn">
                  <mat-option>Nenhum</mat-option>
                  
                  @for (option of filteredOptionsUser | async; track option) {
                    <mat-option [value]="option">{{option.name}}</mat-option>
                  }
                </mat-autocomplete>

              </mat-form-field>

              <mat-form-field appearance="outline"  class="col-md-4 pr-1">
                <mat-label>Situação</mat-label>
                <select matNativeControl required formControlName="active">
                  <option [value]="true">Ativo</option>
                  <option [value]="false">Inativo</option>
                </select>
              </mat-form-field>


              <input formControlName="id_team"  type="hidden"  placeholder="">

          </div>
         
      </form>

   </section>


   <section page-list-body>

      <table class="table table-striped table-sm">
          <thead>
            <tr>
              <th scope="col">ID</th>
              <th scope="col">Membro</th>
              <th scope="col">Ações</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let list of membersList">
              <td>{{ list.id }}</td>
              <td>{{ list.user.name }}</td>
              <td>
                  <button  title="editar" (click)="edit(list.id)"   class="btn btn-outline-primary m-1"   >
                    <i class="bi bi-pencil-fill"></i>
                  </button>
                  <button   title="excluir" (click)="delete(list.id)"  class="btn btn-outline-danger m-1" >
                    <i class="bi bi-trash-fill"></i>
                  </button>
              </td> 
            </tr>
          </tbody>
        </table>
   </section>

</app-default-page-layout>
