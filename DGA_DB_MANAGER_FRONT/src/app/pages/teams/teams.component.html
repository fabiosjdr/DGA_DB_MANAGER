<app-default-page-layout 
title="Equipes" 
[pageForm]="teamsForm" 
path="teams" 
(setList)="setList($event)" 
[disableSaveBtn]="!teamsForm.valid"
>

<section form-page-body>
    <form [formGroup]="teamsForm" class="ng-untouched ng-pristine ng-valid">

        <div class="row">

            <mat-form-field appearance="outline" class="col-md-4 pr-1">
                <mat-label>Título</mat-label>
                <input formControlName="title"  matInput placeholder="">
                <mat-icon matSuffix>person_pin</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="col-md-4 pr-1">
              <mat-label>Workspace</mat-label>
              <input type="text"
                     placeholder="Selecione um cliente"
                     aria-label="usuário"
                     matInput
                     [formControl]="workspacesControl"
                     [matAutocomplete]="autoCategory">

              <mat-autocomplete  #autoCategory="matAutocomplete" (optionSelected)='autoFnWorkspaces.setValue($event.option.value)' [displayWith]="autoFnWorkspaces.displayFn">
                <mat-option>Nenhum</mat-option>
                
                @for (option of filteredOptionsWorkspaces | async; track option) {
                  <mat-option [value]="option">{{option.name}}</mat-option>
                }
              </mat-autocomplete>

            </mat-form-field>
            
        </div>

        <div class="row">

          <mat-form-field appearance="outline" class="col-md-12 pr-1">
              <mat-label>Descrição</mat-label>
              <textarea formControlName="description"  matInput placeholder=""></textarea>
              <mat-icon matSuffix>person_pin</mat-icon>
          </mat-form-field>
            
        </div>

    </form>

 </section>


 <section page-list-body>

    <table class="table table-striped table-sm">
        <thead>
          <tr>
            <th scope="col">ID</th>
            <th scope="col">Title</th>
            <th scope="col">Descrição</th>
            <th scope="col">Ações</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let list of teamsList">
            <td>{{ list.id }}</td>
            <td>{{ list.title }}</td>
            <td>{{ list.description }}</td>
            <td>
                <button  title="editar" (click)="edit(list.id)"   class="btn btn-outline-primary m-1"   >
                  <i class="bi bi-pencil-fill"></i>
                </button>
                <button   title="excluir" (click)="delete(list.id)"  class="btn btn-outline-danger m-1" >
                  <i class="bi bi-trash-fill"></i>
                </button>

                <button  title="membros" (click)="members(list.id)"  class="btn btn-outline-success m-1" >
                  <i class="bi bi-person-add"></i>
                </button>
                
            </td> 
          </tr>
        </tbody>
      </table>
 </section>

</app-default-page-layout>
